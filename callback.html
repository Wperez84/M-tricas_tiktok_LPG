<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorización TikTok — Metricas_LPG</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#1a1a2e}
code{display:block;padding:14px;background:#f1f1ee;border-radius:8px;word-break:break-all;margin:12px 0}
button{padding:10px 18px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}</style></head>
<body>
<h1>Autorización de TikTok</h1>
<p id="msg">Leyendo respuesta…</p>
<code id="code" hidden></code>
<button id="copy" hidden>Copiar code</button>
<script>
const p=new URLSearchParams(location.search);
const msg=document.getElementById('msg'),box=document.getElementById('code'),btn=document.getElementById('copy');
if(p.get('code')){
  msg.textContent='Listo. Copia este code y pégalo en autorizarTikTok() (caduca en pocos minutos):';
  box.textContent=p.get('code');box.hidden=false;btn.hidden=false;
  btn.onclick=()=>navigator.clipboard.writeText(p.get('code')).then(()=>btn.textContent='Copiado');
}else{
  msg.textContent=p.get('error_description')||p.get('error')||'No se recibió ningún code.';
}
</script></body></html>
